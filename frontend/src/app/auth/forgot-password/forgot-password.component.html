<p-toast position="top-right"></p-toast>

<div class="forgot-wrapper">

  <div class="forgot-card">

    <!-- Header -->
    <div class="forgot-header">

      <h1 class="forgot-title">
        Mot de passe oublié
      </h1>

      <p class="forgot-subtitle">
        Entrez votre adresse e-mail pour recevoir
        un lien de réinitialisation.
      </p>

    </div>

    <!-- Form -->
    <form
      class="forgot-form"
      [formGroup]="form"
      (ngSubmit)="submit()">

      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Adresse e-mail
        </label>

        <div class="input-wrap">

          <i class="pi pi-envelope"></i>

          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            placeholder="votre@email.com"
            autocomplete="email"
            [class.input-error]="isInvalid('email')"
          />

        </div>

        <small
          class="field-error"
          *ngIf="isInvalid('email')">

          {{ getError('email') }}

        </small>

      </div>

      <!-- Submit -->
      <button
        type="submit"
        pButton
        class="btn-submit"
        [disabled]="loading || form.invalid">

        <span *ngIf="!loading">
          Envoyer le lien
        </span>

        <span *ngIf="loading">

          <i class="pi pi-spin pi-spinner"></i>

          Envoi...

        </span>

      </button>

    </form>

    <!-- Footer -->
    <div class="forgot-footer">

      <a
        routerLink="/login"
        class="back-link">

        Retour à la connexion

      </a>

    </div>

  </div>

</div>
