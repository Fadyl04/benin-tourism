<p-toast position="top-right"></p-toast>

<div class="reset-wrapper">

  <div class="reset-card">

    <!-- HEADER -->
    <div class="reset-header">

      <div class="header-icon">
        <i class="pi pi-lock"></i>
      </div>

      <h1 class="reset-title">
        Réinitialisation
      </h1>

      <p class="reset-subtitle">
        Définissez un nouveau mot de passe sécurisé
        pour votre compte.
      </p>

    </div>
    <!-- FORM -->
    <form class="reset-form" [formGroup]="form" (ngSubmit)="submit()">
      <!-- PASSWORD -->
      <div class="form-group">

        <label for="newPassword"> Nouveau mot de passe</label>

        <div class="input-wrap">

          <i class="pi pi-lock"></i>

          <input
            pInputText
            id="newPassword"
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder="••••••••"
            autocomplete="new-password"
            [class.input-error]="isInvalid('newPassword')"
          />
          <!-- TOGGLE -->
          <button
            type="button"
            class="toggle-pwd"
            (click)="showNewPassword = !showNewPassword"
          >
            <i class="pi" [ngClass]="showNewPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>

        </div>

        <small class="field-error" *ngIf="isInvalid('newPassword')">
          {{ getError('newPassword') }}
        </small>
        

      </div>


      <!-- CONFIRM PASSWORD -->
      <div class="form-group">

        <label for="confirmPassword"> Confirmer le mot de passe </label>
        <div class="input-wrap">

          <i class="pi pi-lock"></i>

          <input
            pInputText
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
            [class.input-error]=" isInvalid('confirmPassword') || passwordMismatch"
          />
          <!-- TOGGLE -->
          <button
            type="button"
            class="toggle-pwd"
            (click)="showConfirmPassword = !showConfirmPassword"
          >
            <i class="pi"[ngClass]="showConfirmPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>

        </div>

        <small class="field-error" *ngIf="isInvalid('confirmPassword')">
          {{ getError('confirmPassword') }}
        </small>

        <small class="field-error" *ngIf="passwordMismatch">
          Les mots de passe ne correspondent pas !
        </small>

      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        class="btn-submit"
        [disabled]="loading"
      >

        <span *ngIf="!loading">
          Réinitialiser le mot de passe
        </span>

        <span *ngIf="loading">
          <i class="pi pi-spin pi-spinner"></i>
          Réinitialisation...
        </span>
      </button>

    </form>
  </div>

</div>
